<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Background rounded square -->
  <rect width="1024" height="1024" rx="180" fill="#0A8F3C"/>
  <!-- Subtle inner layer -->
  <rect x="20" y="20" width="984" height="984" rx="170" fill="#10A548" opacity="0.4"/>
  <!-- Bell icon -->
  <g transform="translate(512, 460)">
    <!-- Bell body -->
    <path d="M0,-260 C-140,-260 -200,-160 -200,-40 L-200,60 C-200,60 -240,80 -260,120 C-270,140 -260,160 -240,160 L240,160 C260,160 270,140 260,120 C240,80 200,60 200,60 L200,-40 C200,-160 140,-260 0,-260 Z" fill="white"/>
    <!-- Bell clapper -->
    <circle cx="0" cy="200" r="50" fill="white"/>
    <!-- Sound waves left -->
    <path d="M-270,-80 C-310,-40 -310,40 -270,80" stroke="white" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M-320,-120 C-380,-50 -380,50 -320,120" stroke="white" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.35"/>
    <!-- Sound waves right -->
    <path d="M270,-80 C310,-40 310,40 270,80" stroke="white" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M320,-120 C380,-50 380,50 320,120" stroke="white" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.35"/>
    <!-- Number on bell -->
    <text x="0" y="20" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="160" font-weight="bold" fill="#0A8F3C">1</text>
  </g>
</svg>
