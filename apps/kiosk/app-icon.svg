<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Background rounded square -->
  <rect width="1024" height="1024" rx="180" fill="#1565C0"/>
  <!-- Subtle inner shadow -->
  <rect x="20" y="20" width="984" height="984" rx="170" fill="#1976D2" opacity="0.5"/>
  <!-- Ticket shape -->
  <g transform="translate(512, 480)">
    <!-- Ticket body -->
    <rect x="-220" y="-280" width="440" height="560" rx="30" fill="white"/>
    <!-- Ticket notches (left and right) -->
    <circle cx="-220" cy="0" r="35" fill="#1565C0"/>
    <circle cx="220" cy="0" r="35" fill="#1565C0"/>
    <!-- Dashed line between notches -->
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#1565C0" stroke-width="4" stroke-dasharray="12,8" opacity="0.3"/>
    <!-- Top decoration line -->
    <rect x="-160" y="-250" width="320" height="8" rx="4" fill="#1565C0" opacity="0.25"/>
    <!-- Letter -->
    <text x="0" y="-70" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="180" font-weight="bold" fill="#1565C0">A</text>
    <!-- Number -->
    <text x="0" y="110" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="130" font-weight="bold" fill="#0D47A1">001</text>
  </g>
</svg>
