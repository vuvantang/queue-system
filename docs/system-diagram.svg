<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="'Segoe UI', Arial, sans-serif">
  <style>
    .box { rx: 12; ry: 12; }
    .label { text-anchor: middle; fill: #333; font-size: 14px; font-weight: 600; }
    .sublabel { text-anchor: middle; fill: #666; font-size: 12px; }
    .arrow { stroke: #888; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
  </defs>

  <!-- ===== SERVER ===== -->
  <rect x="440" y="20" width="320" height="120" class="box" fill="#D6EAFF" stroke="#2979FF" stroke-width="2.5"/>
  <!-- Server icon -->
  <g transform="translate(530, 42)">
    <rect x="0" y="0" width="50" height="14" rx="3" fill="#2979FF" opacity="0.8"/>
    <circle cx="42" cy="7" r="3" fill="white"/>
    <rect x="0" y="18" width="50" height="14" rx="3" fill="#2979FF" opacity="0.6"/>
    <circle cx="42" cy="25" r="3" fill="white"/>
    <rect x="0" y="36" width="50" height="14" rx="3" fill="#2979FF" opacity="0.4"/>
    <circle cx="42" cy="43" r="3" fill="white"/>
  </g>
  <text x="600" y="108" class="label" font-size="15">Web Server</text>
  <text x="600" y="126" class="sublabel">Quan ly so (Docker)</text>

  <!-- Arrows from server -->
  <path d="M 500 140 L 500 170 L 155 170 L 155 210" class="arrow"/>
  <path d="M 560 140 L 560 180 L 430 180 L 430 210" class="arrow"/>
  <path d="M 640 140 L 640 180 L 710 180 L 710 210" class="arrow"/>
  <path d="M 700 140 L 700 170 L 1000 170 L 1000 210" class="arrow"/>

  <!-- ===== COUNTER A ===== -->
  <rect x="50" y="210" width="210" height="120" class="box" fill="#E8F5E9" stroke="#43A047" stroke-width="2.5"/>
  <!-- Monitor icon -->
  <g transform="translate(120, 225)">
    <rect x="0" y="0" width="44" height="32" rx="3" fill="#43A047" opacity="0.7"/>
    <rect x="4" y="4" width="36" height="24" rx="2" fill="#C8E6C9"/>
    <rect x="16" y="32" width="12" height="6" fill="#43A047" opacity="0.5"/>
    <rect x="10" y="38" width="24" height="3" rx="1" fill="#43A047" opacity="0.5"/>
  </g>
  <text x="155" y="290" class="label" fill="#2E7D32">May tinh A</text>
  <text x="155" y="308" class="sublabel">(Goi so - Counter)</text>

  <!-- ===== COUNTER B ===== -->
  <rect x="325" y="210" width="210" height="120" class="box" fill="#E8F5E9" stroke="#43A047" stroke-width="2.5"/>
  <g transform="translate(395, 225)">
    <rect x="0" y="0" width="44" height="32" rx="3" fill="#43A047" opacity="0.7"/>
    <rect x="4" y="4" width="36" height="24" rx="2" fill="#C8E6C9"/>
    <rect x="16" y="32" width="12" height="6" fill="#43A047" opacity="0.5"/>
    <rect x="10" y="38" width="24" height="3" rx="1" fill="#43A047" opacity="0.5"/>
  </g>
  <text x="430" y="290" class="label" fill="#2E7D32">May tinh B</text>
  <text x="430" y="308" class="sublabel">(Goi so - Counter)</text>

  <!-- ===== COUNTER C ===== -->
  <rect x="600" y="210" width="210" height="120" class="box" fill="#E8F5E9" stroke="#43A047" stroke-width="2.5"/>
  <g transform="translate(670, 225)">
    <rect x="0" y="0" width="44" height="32" rx="3" fill="#43A047" opacity="0.7"/>
    <rect x="4" y="4" width="36" height="24" rx="2" fill="#C8E6C9"/>
    <rect x="16" y="32" width="12" height="6" fill="#43A047" opacity="0.5"/>
    <rect x="10" y="38" width="24" height="3" rx="1" fill="#43A047" opacity="0.5"/>
  </g>
  <text x="705" y="290" class="label" fill="#2E7D32">May tinh C</text>
  <text x="705" y="308" class="sublabel">(Goi so - Counter)</text>

  <!-- ===== KIOSK ===== -->
  <rect x="885" y="210" width="230" height="120" class="box" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/>
  <!-- Kiosk/tablet icon -->
  <g transform="translate(968, 222)">
    <rect x="0" y="0" width="38" height="52" rx="4" fill="#EF6C00" opacity="0.7"/>
    <rect x="3" y="5" width="32" height="38" rx="2" fill="#FFE0B2"/>
    <circle cx="19" cy="48" r="3" fill="#FFE0B2"/>
  </g>
  <text x="1000" y="295" class="label" fill="#E65100">May tinh Kiosk</text>
  <text x="1000" y="313" class="sublabel">(Lay so)</text>

  <!-- Arrows from Kiosk -->
  <path d="M 940 330 L 940 380 L 730 380 L 730 420" class="arrow"/>
  <path d="M 1000 330 L 1000 400 L 1000 420" class="arrow"/>
  <path d="M 1060 330 L 1060 380 L 1140 380 L 1140 420" class="arrow"/>

  <!-- ===== THERMAL PRINTER ===== -->
  <rect x="615" y="420" width="230" height="120" class="box" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/>
  <!-- Printer icon -->
  <g transform="translate(700, 432)">
    <rect x="8" y="0" width="24" height="10" rx="2" fill="#EF6C00" opacity="0.5"/>
    <rect x="0" y="10" width="40" height="24" rx="3" fill="#EF6C00" opacity="0.7"/>
    <rect x="10" y="34" width="20" height="12" rx="1" fill="#FFE0B2"/>
    <line x1="13" y1="38" x2="27" y2="38" stroke="#EF6C00" stroke-width="1" opacity="0.5"/>
    <line x1="13" y1="42" x2="23" y2="42" stroke="#EF6C00" stroke-width="1" opacity="0.5"/>
  </g>
  <text x="730" y="500" class="label" fill="#E65100">May in nhiet</text>
  <text x="730" y="518" class="sublabel">(In so thu tu)</text>

  <!-- ===== SPEAKER ===== -->
  <rect x="885" y="420" width="230" height="120" class="box" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/>
  <!-- Speaker icon -->
  <g transform="translate(975, 432)">
    <rect x="0" y="10" width="12" height="16" fill="#EF6C00" opacity="0.7"/>
    <polygon points="12,6 30,0 30,36 12,30" fill="#EF6C00" opacity="0.7"/>
    <path d="M34,8 C40,14 40,22 34,28" stroke="#EF6C00" stroke-width="2.5" fill="none" opacity="0.5"/>
    <path d="M38,2 C48,10 48,26 38,34" stroke="#EF6C00" stroke-width="2" fill="none" opacity="0.3"/>
  </g>
  <text x="1000" y="500" class="label" fill="#E65100">He thong am thanh</text>
  <text x="1000" y="518" class="sublabel">(Phat thong bao)</text>

  <!-- ===== TV DISPLAY ===== -->
  <rect x="50" y="420" width="230" height="120" class="box" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2.5"/>
  <!-- TV icon -->
  <g transform="translate(130, 432)">
    <rect x="0" y="0" width="56" height="38" rx="3" fill="#EF6C00" opacity="0.7"/>
    <rect x="4" y="4" width="48" height="30" rx="2" fill="#FFE0B2"/>
    <rect x="20" y="38" width="16" height="5" fill="#EF6C00" opacity="0.5"/>
    <rect x="12" y="43" width="32" height="3" rx="1" fill="#EF6C00" opacity="0.5"/>
    <!-- Play icon on screen -->
    <text x="16" y="26" font-size="14" fill="#EF6C00" opacity="0.6">001</text>
  </g>
  <text x="165" y="505" class="label" fill="#E65100">Tivi hien thi</text>
  <text x="165" y="523" class="sublabel">(Hien thi so thu tu)</text>

  <!-- Arrow from Kiosk to TV -->
  <path d="M 935 330 L 935 390 L 165 390 L 165 420" class="arrow"/>

  <!-- ===== LEGEND ===== -->
  <rect x="50" y="600" width="1100" height="80" rx="10" fill="#F5F5F5" stroke="#DDD" stroke-width="1"/>
  <text x="100" y="630" font-size="13" font-weight="bold" fill="#555">Chu thich:</text>

  <rect x="100" y="645" width="18" height="18" rx="3" fill="#D6EAFF" stroke="#2979FF" stroke-width="1.5"/>
  <text x="125" y="659" font-size="12" fill="#555">Server (Docker)</text>

  <rect x="280" y="645" width="18" height="18" rx="3" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
  <text x="305" y="659" font-size="12" fill="#555">Quay goi so (Counter App)</text>

  <rect x="520" y="645" width="18" height="18" rx="3" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5"/>
  <text x="545" y="659" font-size="12" fill="#555">Thiet bi ngoai vi &amp; Kiosk</text>

  <line x1="750" y1="654" x2="790" y2="654" class="arrow"/>
  <text x="800" y="659" font-size="12" fill="#555">Ket noi mang LAN / Wi-Fi</text>
</svg>
