<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
  <title>Queue Server</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root {
      --bg: #f0f5ed;
      --surface: #ffffff;
      --surface-sunk: #f0f5ed;
      --ink: #1a2e1a;
      --ink-muted: #4a6b4a;
      --green: #1b8a2a;
      --green-dark: #14531b;
      --gold: #b8860b;
      --gold-light: #d4a017;
      --line: rgba(27, 138, 42, 0.14);
      --line-strong: rgba(27, 138, 42, 0.32);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --dur-fast: 140ms;
      --dur-base: 220ms;
      --dur-slow: 420ms;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    ::selection { background: rgba(27, 138, 42, 0.22); color: var(--green-dark); }
    :focus-visible { outline: 3px solid var(--gold-light); outline-offset: 2px; }
    body {
      font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    .card {
      background: var(--surface);
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 1px 2px rgba(20, 83, 27, 0.05), 0 8px 28px rgba(20, 83, 27, 0.07);
      border: 1px solid var(--line);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .header img { height: 52px; width: auto; border-radius: 8px; flex-shrink: 0; }
    .header img.hidden { display: none; }
    .header h1 {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--green-dark);
      text-wrap: balance;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 15px;
      font-weight: 500;
      color: var(--ink-muted);
    }
    .status-dot {
      width: 10px; height: 10px;
      background: #22a832;
      border-radius: 50%;
    }
    .info-grid {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 10px 16px;
      font-size: 15px;
      line-height: 1.45;
      margin-bottom: 28px;
      padding: 18px 20px;
      background: var(--surface-sunk);
      border-radius: 12px;
    }
    .info-label { color: var(--ink-muted); font-weight: 600; }
    .info-value { color: var(--ink); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    .info-value a { color: var(--green); text-underline-offset: 3px; }
    .nav { display: flex; flex-direction: column; gap: 12px; }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px 14px 16px;
      min-height: 64px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      text-decoration: none;
      color: var(--ink);
      transition:
        background-color var(--dur-fast) var(--ease-out),
        border-color var(--dur-fast) var(--ease-out),
        transform var(--dur-fast) var(--ease-out);
    }
    .nav-btn:hover {
      background: #f3f8f1;
      border-color: var(--line-strong);
    }
    .nav-btn:active { transform: scale(0.99); }
    .nav-btn .icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }
    .nav-btn .icon svg,
    .nav-btn .chevron {
      width: 22px; height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon-admin { background: var(--green); }
    .icon-tv { background: var(--gold); }
    .nav-btn .text { flex: 1; min-width: 0; }
    .nav-btn .text strong { display: block; font-size: 16px; font-weight: 700; line-height: 1.3; }
    .nav-btn .text span { display: block; font-size: 13px; color: var(--ink-muted); margin-top: 2px; }
    .nav-btn .chevron {
      width: 20px; height: 20px;
      color: var(--ink-muted);
      flex-shrink: 0;
      transition: transform var(--dur-base) var(--ease-out), color var(--dur-fast) var(--ease-out);
    }
    .nav-btn:hover .chevron { transform: translateX(3px); color: var(--green-dark); }
    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--ink-muted);
    }
    @media (max-width: 480px) {
      body { align-items: flex-start; padding: 16px; }
      .card { padding: 24px 20px; }
      .header h1 { font-size: 22px; }
      .header img { height: 44px; }
      .info-grid { grid-template-columns: 88px 1fr; padding: 14px 16px; font-size: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .nav-btn:active { transform: none; }
      .nav-btn:hover .chevron { transform: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <img id="logo" class="hidden" alt="">
        <h1 id="org-name">Queue Server</h1>
      </div>

      <div class="status">
        <div class="status-dot" aria-hidden="true"></div>
        <span>Server đang hoạt động</span>
      </div>

      <div class="info-grid">
        <span class="info-label">Địa chỉ</span>
        <span class="info-value" id="server-url"></span>
        <span class="info-label">Khu vực</span>
        <span class="info-value" id="area-count">-</span>
        <span class="info-label">Hàng đợi</span>
        <span class="info-value" id="queue-info">-</span>
        <span class="info-label">Thời gian</span>
        <span class="info-value" id="server-time"></span>
      </div>

      <div class="nav">
        <a href="/admin/" class="nav-btn">
          <div class="icon icon-admin" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
          </div>
          <div class="text">
            <strong>Quản trị hệ thống</strong>
            <span>Cài đặt, khu vực, tài khoản</span>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
        <a href="/tv" class="nav-btn">
          <div class="icon icon-tv" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          </div>
          <div class="text">
            <strong>Màn hình TV</strong>
            <span>Hiển thị hàng đợi cho khách</span>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </div>
    </div>

    <div class="footer">Queue - Hệ thống quản lý hàng đợi</div>
  </div>

  <script>
    (async function() {
      const API = location.origin + '/api';

      document.getElementById('server-url').textContent = location.origin;

      try {
        const res = await fetch(API + '/settings');
        const s = await res.json();
        if (s.org_name) document.getElementById('org-name').textContent = s.org_name;
        if (s.logo) {
          const logo = document.getElementById('logo');
          logo.src = s.logo;
          logo.classList.remove('hidden');
        }
      } catch(e) {}

      try {
        const res = await fetch(API + '/areas');
        const areas = await res.json();
        const active = areas.filter(a => a.is_active);
        document.getElementById('area-count').textContent = active.length + ' khu vực';

        let totalWaiting = 0;
        let totalServing = 0;
        for (const area of active) {
          try {
            const qr = await fetch(API + '/areas/' + area.id + '/queue');
            const q = await qr.json();
            totalWaiting += q.waiting_count;
            totalServing += q.serving.length;
          } catch(e) {}
        }
        document.getElementById('queue-info').textContent = totalServing + ' đang phục vụ, ' + totalWaiting + ' đang chờ';
      } catch(e) {}

      function updateTime() {
        document.getElementById('server-time').textContent = new Date().toLocaleString('vi-VN');
      }
      updateTime();
      setInterval(updateTime, 1000);
    })();
  </script>
</body>
</html>
